html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #0d0b09;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* --- экран загрузки --- */

#status {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 2;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background:
		radial-gradient(ellipse 70% 55% at 50% 46%, rgba(245, 184, 66, 0.10), rgba(245, 184, 66, 0) 70%),
		radial-gradient(ellipse at 50% 50%, #17120d 0%, #0d0b09 75%);
	opacity: 1;
	transition: opacity 0.8s ease;
	user-select: none;
	-webkit-user-select: none;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#ld-box {
	width: min(82vw, 440px);
	display: flex;
	flex-direction: column;
	align-items: center;
	transform: translateY(-4vh);
}

#ld-title {
	font-family: 'PulseAccent', Georgia, serif;
	font-size: min(22vw, 104px);
	line-height: 1;
	letter-spacing: 0.04em;
	color: #f5b842;
	text-shadow: 0 0 18px rgba(245, 184, 66, 0.25);
	animation: ld-beat 1.8s ease-in-out infinite;
}

#ld-sub {
	margin-top: 0.35em;
	font-family: 'PulseAccent', Georgia, serif;
	font-size: min(7vw, 34px);
	letter-spacing: 0.08em;
	color: #8c6b2e;
}

/* Двойной удар, как у сердца: тук-тук — пауза. */
@keyframes ld-beat {
	0%, 100% { text-shadow: 0 0 16px rgba(245, 184, 66, 0.20); }
	8%       { text-shadow: 0 0 30px rgba(245, 184, 66, 0.60); }
	16%      { text-shadow: 0 0 18px rgba(245, 184, 66, 0.28); }
	24%      { text-shadow: 0 0 26px rgba(245, 184, 66, 0.48); }
	40%      { text-shadow: 0 0 16px rgba(245, 184, 66, 0.20); }
}

#ld-line {
	width: 100%;
	height: auto;
	margin-top: min(8vh, 48px);
	overflow: visible;
}

#ld-base {
	fill: none;
	stroke: rgba(245, 184, 66, 0.14);
	stroke-width: 1.6;
	stroke-linejoin: round;
	stroke-linecap: round;
}

#ld-fill {
	fill: none;
	stroke: #f5b842;
	stroke-width: 2.2;
	stroke-linejoin: round;
	stroke-linecap: round;
	filter: drop-shadow(0 0 3px rgba(245, 184, 66, 0.7));
}

#ld-head {
	fill: #ffe2a6;
	filter: drop-shadow(0 0 5px rgba(255, 210, 120, 0.95));
}

#ld-caption {
	margin-top: min(4vh, 22px);
	font-family: 'PulseDoc', Georgia, serif;
	font-size: min(4.6vw, 19px);
	letter-spacing: 0.03em;
	color: #9e9485;
	animation: ld-breathe 3.2s ease-in-out infinite;
}

@keyframes ld-breathe {
	0%, 100% { opacity: 0.55; }
	50%      { opacity: 1; }
}

#status-notice {
	display: none;
	margin: 0 2rem;
	max-width: 440px;
	padding: 1rem 1.2rem;
	border: 1px solid rgba(214, 90, 70, 0.6);
	border-radius: 6px;
	background: rgba(40, 16, 12, 0.85);
	color: #e8d9c4;
	font-family: 'PulseDoc', Georgia, serif;
	font-size: 16px;
	line-height: 1.35;
	text-align: center;
